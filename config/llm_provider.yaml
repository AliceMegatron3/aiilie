# 安全说明：此文件在 Git 中仅跟踪非敏感字段。api_key 一律通过环境变量
# AIILIE_DEEPSEEK_API_KEY 注入（config_manager 优先级最高），不得在此明文填写。
# 历史版本曾把明文密钥提交到仓库，已在供应商侧轮换并从此文件清除；
# 若仍需持久化密钥，请写入 .env 并由启动脚本注入，禁止提交。
deepseek:
  api_base: https://inferaiapi.com/v1
  # 真实密钥请通过环境变量 AIILIE_DEEPSEEK_API_KEY 注入，留空则云端功能自动禁用
  api_key: ""
  model_name: deepseek-v4-flash
  enable_switch: true
  request_timeout: 60
  max_retry_times: 2
ollama:
  api_base: http://127.0.0.1:11434
  model_name: qwen3-pipeline:latest
  enable_switch: true
