# ⚠️ 安全提示：请勿在此文件明文保存 API 密钥。
# 推荐通过环境变量 AIILIE_DEEPSEEK_API_KEY 注入，或使用下方 api_key 占位符。
deepseek:
  # 中转站实测(20260816):OpenAI兼容端点必须带 /v1,否则请求打到网站首页返回HTML。
  # 备用加速线路: https://api.inferaiapi.com/v1 (遇524超时可切换)
  api_base: https://inferaiapi.com/v1
  api_key: ""  # 请通过环境变量 AIILIE_DEEPSEEK_API_KEY 注入，或在此填写（注意勿提交到版本库）
  model_name: deepseek-v4-flash
  enable_switch: true
  request_timeout: 60
  max_retry_times: 2
  # 第三部分（补丁F）：true 时 ModelDispatcher 自动跳过会话池（裸调用，不拼接历史）
  disable_session_pool: false
ollama:
  api_base: http://127.0.0.1:11434
  model_name: deepseek-r1:7b
  enable_switch: true
