# API 路由增强与意图识别
enable_raw_keyword_intent: true

# ── 运行环境 ──
# 开发默认匿名兼容；生产部署请通过 AIILIE_RUNTIME_ENV=production 开启安全校验。
runtime:
  environment: development

# ── 安全配置（安全加固新增） ──
security:
  # 生产环境建议开启：开启后所有 /api/v1 接口强制要求 Bearer/API Token
  require_auth: false
  # 令牌签名密钥：请通过环境变量 AIILIE_SECURITY_AUTH_SECRET 覆盖，勿明文提交
  auth_secret: ""

# ── 请求限流（Token Bucket，桌面单用户场景，防异常轮询风暴） ──
rate_limiter:
  # 每秒补充令牌数
  rate: 50
  # 桶容量（允许的瞬时突发请求数）
  capacity: 100

library:
  max_concurrent_quantize: 2
  upload_max_mb: 20

# ── Docling 可选生产接入（默认关闭，非必需运行时依赖） ──
# docling 为重型可选依赖（含模型工件），不随主 requirements 安装。
# 开启条件（满足后再把 enabled 翻为 true）：
#   1) 手动安装：pip install docling
#   2) config.yaml 设 docling.enabled=true，或环境变量 AIILIE_DOCLING_ENABLED=true
#      （config_manager 自动映射；Dockerfile.enhanced 增强镜像已预装并开启）
#   3) 生产环境建议选用增强镜像：docker build -f Dockerfile.enhanced -t no0_ai_backend:enhanced .
# 开启后仅对 .pdf/.docx/.epub 生效，.txt/.md 仍走内置轻量解析器；
# docling 未安装或解析失败时自动回退现有轻量解析器（默认行为不变）。
docling:
  # 总开关：false 时 ParserFactory 一律使用轻量解析器
  enabled: false
  # 页数上限：超过则截断并标记 truncated（provenance.truncated=true）
  page_limit: 200
  # CPU 线程数（docling 转换线程上限，尽力而为）
  cpu_threads: 2
  # 单次解析超时（秒），超时返回失败并携带原因
  timeout_seconds: 120
  # 并发解析数上限（asyncio.Semaphore，跨请求共享）
  max_concurrency: 2
  # 离线模式：true 时要求模型工件已在本地缓存目录，缺失则解析失败并提示预下载命令
  offline: false
  # 模型工件缓存目录；留空则默认 %APPDATA%/No0_AI_V4/data/docling_models
  model_cache_dir: ""

# ── 轻量解析器资源限制（方向报告 P1-2：页数/成员数/解压大小/超时） ──
# 对内置 Txt/Pdf/Docx/Epub 解析器施加确定性资源上限，防止超大文档或
# 恶意压缩包（zip bomb）拖垮宿主进程；触发限制时安全截断/拒绝而非崩溃。
parser:
  # 页数上限：PDF 仅解析前 N 页；超过标记 truncated
  page_limit: 200
  # EPUB 归档最大成员数：超过拒绝（防解压数量爆炸）
  epub_max_members: 2000
  # EPUB 单个成员解压后字节上限：超过拒绝该成员（防单文件膨胀）
  epub_member_max_bytes: 10485760
  # EPUB 全归档解压累计字节上限：超过拒绝剩余成员（防 zip bomb）
  epub_max_decompressed_bytes: 52428800
  # 单次解析总超时（秒）
  timeout_seconds: 120


# Ledger 权威切换（第二步）：authoritative 已开启，读取走 ledger_claims、
# 写入经 LedgerReadiness 门禁 fail-closed；灰度稳定后已关闭旧 direct card write，
# cards 表仅只读投影，业务写入走 Ledger（claims+outbox）。
ledger:
  read_mode: ledger
  # 双读开启用于 readiness 观察（authoritative 已切换，灰度观察期）
  dual_read_enabled: true
  # 阶段C fail-closed：authoritative 仅在真实迁移 + reconciliation 通过 readiness
  # 门禁后才由运维显式打开；新环境/容器默认保持 false，避免启动被迁移门禁阻断。
  authoritative: false
  allow_legacy_card_projection: false
  # 上传文件大小上限（MB）
  upload_max_mb: 20
  # 量化提取策略: auto(LLM优先+规则兜底) / llm(仅LLM) / rule(仅规则)
  quantize_extraction: auto

# ── 受限代码执行资源档位 ──
# 阶段A fail-closed：隔离 worker 建成前默认关闭执行能力。
# 关闭后 /code/run 及正式 promote/rollback 返回 501 DISABLED，
# 只读的 plan/diff/snapshot/stage 不受影响。
code_execution:
  enabled: false
  default_profile: auto
  # 操作系统级网络隔离策略（对 CodeTask 进程的可执行文件施加临时出站防火墙规则）：
  #   off        → 不施加限制（默认，保持现状）
  #   local_only → 阻断对本地子网的出站（netsh remoteip=localsubnet）
  #   full       → 阻断全部出站（netsh remoteip=any）
  # 需要 Windows 管理员权限；无法施加时任务报告标记 network_isolation: "not_enforced"。
  network_policy: "off"
  host_reserve:
    cpu_cores: 2
    memory_mb: 4096
    disk_gb: 8
  profiles:
    low:
      cpu_cores: 1
      memory_mb: 128
      disk_gb: 1
      max_processes: 4
      timeout_seconds: 300
      cpu_time_seconds: 300
    standard:
      cpu_cores: 6
      memory_mb: 8192
      disk_gb: 20
      max_processes: 8
      timeout_seconds: 900
      cpu_time_seconds: 900
    high:
      cpu_cores: 8
      memory_mb: 16384
      disk_gb: 40
      max_processes: 16
      timeout_seconds: 1800
      cpu_time_seconds: 1800

# ── 智能体受控公网抓取 ──
# 不授予 CodeTask 或第三方插件任意网络权限。
web_access:
  enabled: true
  max_response_bytes: 1048576
  timeout_seconds: 15
  max_redirects: 0
  max_requests_per_minute: 20

# ── 插件（阶段A fail-closed）──
# 未完成隔离 worker / 内存预算前，禁止执行任何插件；只保留清单/解析/安装。
plugins:
  execution_enabled: false

# ── 项目与文档（功能补全新增） ──
project:
  # 文档版本历史最大保留版本数
  max_doc_versions: 20

# ── 批次1 分段执行引擎（P0/P1/P2 修复新增配置） ──
task:
  # P0-1: 分段结果写入 SQLite 的字节阈值（默认 10KB）
  # 超过阈值时 result_content 置空，只持久化 output_path 磁盘路径
  max_db_payload_bytes: 10240
  # P0-1: 兼容回退开关，开启后大结果也允许写入数据库（旧逻辑）
  allow_large_payload_in_db: false
  # P1-4: 尾巴 JSON 体积阈值（默认 64KB），超过则落盘双模式
  tail_memory_threshold_bytes: 65536
  # P1-4: 尾巴磁盘卸载开关，关闭后全部尾巴驻留内存（旧逻辑）
  enable_tail_disk_offload: true
  # P1-4: 落盘尾巴 TTL（秒），过期后可被启动清理回收
  tail_ttl_seconds: 86400
  # P2-6: 临时目录磁盘配额（GB），超限触发 LRU 淘汰
  temp_max_size_gb: 2
  # P2-6: 启动时扫描清理孤儿临时目录
  cleanup_orphan_on_start: true
  # P0-3: 长任务判定字数阈值（与 CommandSplitter 对齐）
  long_command_min_chars: 2000
  # 专项4修复：全局硬超时（秒）
  # max_queue_seconds: 任务在队列中等待的最长时间，超过则强制 FAILED(timeout)
  max_queue_seconds: 3600
  # max_run_seconds: 任务执行（含分段）的最长时间，超过则强制 FAILED(timeout)
  max_run_seconds: 1800

# ── 批次5 全局路由器（P0-3 集成修复新增配置） ──
global_router:
  # 长任务（创作/量化/深度思考）是否走批次1分段执行引擎
  # 关闭后切回旧闭包队列逻辑，用于回退调试
  use_batch1_engine: true

# ── 结果合并器（P0-2 流式合并新增配置） ──
result_merger:
  # merge_and_load 兼容模式的内存加载阈值（默认 1MB）
  # 超过阈值只返回文件路径，不返回内存字符串
  memory_load_threshold_bytes: 1048576

# ── 指令负载预估器（B1-09 新增配置） ──
load_estimator:
  # 总开关：关闭后整套负载预估失效，全部任务回退原始 auto 逻辑（补丁前行为）
  enable: true
  # 指令字符 ≤ 该值视为 SHORT（短指令），超过视为 LONG（长指令）
  command_short_threshold: 1200
  # 关联卡片数 ≥ 该值视为 EXTERNAL_HIGH（外部资源高负载）
  external_high_card_threshold: 8

# 创作闭环后置自动反思采样
auto_reflection_after_creation:
  enable: true
  probability: 0.2
  min_token_threshold: 500

llm:
  enable_context_truncate: true
  resource_sense:
    enable: true
    memory_threshold_pct: 85
reflection:
  schedule_cron: "0 2 * * *"

feature:
  # ── P1(专精能手施工图):行为插件编辑通行总开关 ──
  # 关闭后 supervisor 精修链不再执行打磨通行(回退纯专家链)
  behavior_plugins_enable: true
  # ── 批次4:空闲索引器总开关 ──
  # 关闭后完全不产生索引产物(摘要卡/矛盾巡检/实体初筛全部停)
  idle_index_enable: true
  # ── 第十部分：多智能体小说创作 总开关（总控）──
  # 关闭后多智能体自学习全部停止，多Agent功能不受影响（回退原创作链路）
  # 开启条件（文档化：满足后再翻转，避免未经验证的线上行为变更；默认保持 false）：
  #  1) SkillGovernance 闭环验证通过：开启前先跑 tests/test_skill_governance_closure.py 等治理闭环测试；
  #  2) Ledger 权威切换灰度稳定：ledger.authoritative 已通过 readiness 门禁，旧卡片投影冻结为只读；
  #  3) 旧投影已全量对账：services/skill_projection_reconcile.py 的 list_projection_gaps 缺口清零后，
  #     再以 reconcile_old_projections 幂等导入（见 tests/test_skill_projection_reconcile.py）。
  #  开关关闭时，app.state.skill_projection_reconcile.list_gaps() 仍可只读观察缺口，不写库。
  novel_multi_agent_enable: false
  emotion_quantify_enable: true
  # 架构整改 1.1：分支版本系统总开关。
  # true  → 文档版本/平行宇宙剧情全部走补丁3 Branch/DocumentVersion 分支体系；
  # false → 完全回退旧简易版本历史（ProjectManager 兼容层），默认关闭保证向后兼容。
  branch_version_enable: false
  # ── 业务补丁 1-4 独立开关（第五部分） ──
  # 补丁1：非线性叙事时间轴系统
  timeline_enable: true
  # 补丁2：沉浸式角色语调 TTS 与校对系统
  tts_enable: true
  # 补丁4：场景可视化分镜生成系统
  storyboard_enable: true
  # 批次7：深度思考与元认知扩展系统
  deep_thinking_enable: true

emotion_engine:
  max_sensitive_rewrite_round: 2
  chaotic_threshold: 7
  max_task_timeout_sec: 120
  max_task_total_token: 8192
  recent_frame_keep_count: 3

# ── P1/P2(专精能手施工图):行为插件(编辑通行)档位与超时 ──
# 运维口径:打磨对模型档位要求低于创作本体;实测中转站晚高峰
# 60s 超时率高,编辑通行默认走 rapid 档 + 独立更短超时,
# 超时/失败自动回退通行前文本(保底不伤稿)。editor_mode 可选 rapid/think。
behavior_plugins:
  editor_mode: rapid
  request_timeout: 45

# ── 补丁1：时间轴系统配置 ──
timeline:
  # 单项目时间线轨道数上限
  max_tracks: 6
  # 单时间线事件数上限
  max_events_per_timeline: 200

# ── 补丁2：TTS 配置 ──
tts:
  # 引擎：vits_local（本地离线，Windows SAPI 兜底）/ azure / elevenlabs
  engine: vits_local
  # Azure 语音服务（引擎=azure 时需要）
  azure_key: ""
  azure_region: ""
  # ElevenLabs（引擎=elevenlabs 时需要）
  elevenlabs_api_key: ""
  # 音频缓存目录 TTL（秒）
  cache_ttl_seconds: 86400

# ── 批次7：深度思考配置 ──
deep_thinking:
  # 行为日志单文件轮转上限（字节）
  behavior_log_max_bytes: 524288
  # 行为日志保留文件数
  behavior_log_backup_count: 3
  # 检查点保留数
  checkpoint_keep_count: 10

# ── 第十部分：多智能体小说创作 自学习闭环配置 ──
novel_agent:
  # 子开关：关闭后整套自学习停止（反思提取/技能沉淀/优胜劣汰），多Agent照常运行
  enable_self_reflect_learn: false
  # 最小样本数：达到该数量才允许生成规则/技能，避免小样本误判
  min_sample_count: 5
  # 置信度阈值：低于该值的规则进入补丁B人工审核队列
  confidence_threshold: 0.75
  # 效果评估降权阈值：effect_score 低于该值自动归档（只降权不删除）
  archive_effect_threshold: 0.25

paths:
  emotion_frames_dir: "./data/emotion_frames"
