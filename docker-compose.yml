version: '3.8'

services:
  backend:
    # 默认镜像不装 docling（轻量，避免引入重型模型依赖）。
    # 生产增强（表格/页码/版面解析）可选用增强镜像：
    #   1) docker build -f Dockerfile.enhanced -t no0_ai_backend:enhanced .
    #      然后将下方 build: . 改为 image: no0_ai_backend:enhanced；
    #   2) 增强镜像已设 AIILIE_DOCLING_ENABLED=true 自动启用 docling 解析；
    #   3) 离线部署请将预下载的模型工件挂载到 docling.model_cache_dir 对应目录，
    #      并设置 AIILIE_DOCLING_OFFLINE=true。
    build: .
    container_name: no0_ai_backend
    ports:
      # 阶段A：仅绑定回环地址，避免把服务暴露到所有宿主接口
      - "127.0.0.1:8000:8000"
    volumes:
      # 将宿主机的 data 目录挂载到容器内，保证配置、日志、SQLite 数据持久化
      - ./data:/app/data
      - ./config:/app/config
    environment:
      # 可在此处注入并覆盖 config.yaml 的配置，例如：
      # - AIILIE_DEEPSEEK_API_KEY=your_key_here
      # 生产部署必须设置：AIILIE_RUNTIME_ENV=production、
      # AIILIE_SECURITY_REQUIRE_AUTH=true、AIILIE_SECURITY_AUTH_SECRET=<随机密钥>
      - AIILIE_RUNTIME_ENV=${AIILIE_RUNTIME_ENV:-development}
      - AIILIE_SECURITY_REQUIRE_AUTH=${AIILIE_SECURITY_REQUIRE_AUTH:-false}
      - AIILIE_SECURITY_AUTH_SECRET=${AIILIE_SECURITY_AUTH_SECRET:-}
      # 代码执行与插件执行在隔离 worker 建成前默认关闭（阶段A fail-closed）
      - AIILIE_CODE_EXECUTION_ENABLED=${AIILIE_CODE_EXECUTION_ENABLED:-false}
      - TZ=Asia/Shanghai
      # 缓存：默认 memory（未将 redis 加入锁定依赖前，避免虚假分布式缓存）
      - CACHE_BACKEND=${CACHE_BACKEND:-memory}
      - REDIS_URL=redis://:${REDIS_PASSWORD:-no0_ai_insecure_placeholder}@redis:6379/0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: no0_ai_redis
    # 阶段A：不问宿主暴露 6379 端口；仅容器内部网络可达，并强制密码认证。
    # 生产必须通过 REDIS_PASSWORD 注入强口令，禁止使用占位默认值启动。
    ports: []
    command: [
      "redis-server",
      "--requirepass", "${REDIS_PASSWORD:-no0_ai_insecure_placeholder}",
      "--appendonly", "yes"
    ]
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    # 如果系统只想运行单体版本，可以通过 `docker compose up backend` 或修改 CACHE_BACKEND=memory 来忽略 redis
