version: '3.8'

services:
  backend:
    build: .
    container_name: no0_ai_backend
    ports:
      - "8000:8000"
    volumes:
      # 将宿主机的 data 目录挂载到容器内，保证配置、日志、SQLite 数据持久化
      - ./data:/app/data
      - ./config:/app/config
    environment:
      # 可在此处注入并覆盖 config.yaml 的配置，例如：
      # - AIILIE_DEEPSEEK_API_KEY=your_key_here
      # 生产部署必须设置：AIILIE_RUNTIME_ENV=production、
      # AIILIE_SECURITY_REQUIRE_AUTH=true、AIILIE_SECURITY_AUTH_SECRET=<随机密钥>
      - AIILIE_RUNTIME_ENV=${AIILIE_RUNTIME_ENV:-development}
      - AIILIE_SECURITY_REQUIRE_AUTH=${AIILIE_SECURITY_REQUIRE_AUTH:-false}
      - AIILIE_SECURITY_AUTH_SECRET=${AIILIE_SECURITY_AUTH_SECRET:-}
      - TZ=Asia/Shanghai
      # 缓存开关适配（Patch A 分布式预备）：若设为 redis，则使用 redis 容器；设为 memory 则降级为本机内存
      - CACHE_BACKEND=${CACHE_BACKEND:-memory}
      - REDIS_URL=redis://redis:6379/0
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/health/ready', timeout=3)"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 20s
    depends_on:
      redis:
        condition: service_started

  redis:
    image: redis:7-alpine
    container_name: no0_ai_redis
    ports:
      - "6379:6379"
    volumes:
      - ./data/redis:/data
    restart: unless-stopped
    # 如果系统只想运行单体版本，可以通过 `docker compose up backend` 或修改 CACHE_BACKEND=memory 来忽略 redis
